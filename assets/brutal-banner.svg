  <text x="124" y="72" fill="#000000" font-family="Arial Black, Arial, sans-serif" font-size="22" font-weight="900">NEO BRUTAL MODE</text>

  <text x="112" y="162" fill="#000000" font-family="Arial Black, Arial, sans-serif" font-size="70" font-weight="900">Suraj</text>
  <text x="112" y="232" fill="#000000" font-family="Arial Black, Arial, sans-serif" font-size="70" font-weight="900">Singh</text>
  <text x="112" y="270" fill="#000000" font-family="Arial Black, Arial, sans-serif" font-size="28" font-weight="900">FULL-STACK SOFTWARE ENGINEER</text>
  <text x="112" y="300" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Building scalable products with clean execution.</text>

  <text x="864" y="126" fill="#000000" font-family="Arial Black, Arial, sans-serif" font-size="29" font-weight="900">AI-POWERED</text>

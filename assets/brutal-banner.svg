  <rect width="1280" height="420" fill="#FFF9F0"/>

  <rect x="108" y="50" width="320" height="54" rx="18" fill="#000000"/>
  <rect x="96" y="38" width="320" height="54" rx="18" fill="#FF8A65" stroke="#000000" stroke-width="6"/>

  <rect x="84" y="90" width="712" height="236" rx="28" fill="#000000"/>
  <rect x="72" y="78" width="712" height="236" rx="28" fill="#FFE45E" stroke="#000000" stroke-width="6"/>

  <rect x="842" y="90" width="368" height="118" rx="26" fill="#000000"/>

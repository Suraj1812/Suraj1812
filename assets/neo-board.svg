  <text x="104" y="198" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">and production-ready digital products with</text>
  <text x="104" y="230" fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">clean architecture and a product-first lens.</text>

